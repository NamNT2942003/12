version: '3.8'

services:
  gateway:
    image: nginx:alpine
    container_name: api-gateway
    restart: always
    ports:
      - "80:80"  # Cổng duy nhất được công khai ra ngoài Internet
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - user-service
      - order-service

  user-service:
    image: my-user-api:latest
    container_name: user-service
    restart: always
    expose:
      - "8080"   # Mở cổng nội bộ trong Docker network
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    networks:
      - app-network
    depends_on:
      - db

  order-service:
    image: my-order-api:latest
    container_name: order-service
    restart: always
    expose:
      - "8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_here
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
